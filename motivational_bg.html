<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCK IN — Focus & Anti-Procrastination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070c;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --danger-glow: rgba(239, 68, 68, 0.2);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .glow-1 {
      position: absolute;
      top: -20%;
      left: 20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      animation: pulse 8s infinite alternate ease-in-out;
    }

    .glow-2 {
      position: absolute;
      bottom: -20%;
      right: 20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      animation: pulse 10s infinite alternate-reverse ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.15); }
    }

    .card {
      max-width: 800px;
      width: 100%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Huge Motivational Heading */
    .quote-box {
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quote-text {
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Clock / Timer */
    .clock-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .time-time {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 30px var(--accent-glow);
    }

    .time-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* Controls */
    .btn-next {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px var(--accent-glow);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-next:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(99, 102, 241, 0.6);
    }

    .btn-next:active {
      transform: translateY(0);
    }

    .sub-footer {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card">
    <div class="status-tag">
      <span class="pulse-dot"></span>
      Stop Wasting Time &bull; Lock In
    </div>

    <!-- Live Clock -->
    <div class="clock-display">
      <div class="time-time" id="clock">00:00:00</div>
      <div class="time-label">Current Local Time &bull; Every Second Counts</div>
    </div>

    <!-- Motivational Quotes -->
    <div class="quote-box">
      <div class="quote-text" id="quote-el">
        "Your future self is watching you right now through memories. Make them proud."
      </div>
    </div>

    <!-- Action -->
    <button class="btn-next" onclick="nextQuote()">
      ⚡ Next Motivation
    </button>

    <div class="sub-footer">
      Close this tab & get back to your work.
    </div>
  </div>

  <script>
    const quotes = [
      "Your future self is watching you right now through memories. Make them proud.",
      "Every minute you waste is time you will beg for later.",
      "Stop scrolling. Start building.",
      "Discipline is choosing between what you want now and what you want most.",
      "You don't need motivation. You need execution.",
      "Someone with less talent is outworking you right now.",
      "Small daily wins compound into massive lifetime achievements.",
      "Lock in. The hard work you put in today pays off tomorrow."
    ];

    let currentIdx = 0;
    const quoteEl = document.getElementById('quote-el');
    const clockEl = document.getElementById('clock');

    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function nextQuote() {
      quoteEl.style.opacity = '0';
      quoteEl.style.transform = 'translateY(8px)';
      setTimeout(() => {
        currentIdx = (currentIdx + 1) % quotes.length;
        quoteEl.textContent = `"${quotes[currentIdx]}"`;
        quoteEl.style.opacity = '1';
        quoteEl.style.transform = 'translateY(0)';
      }, 250);
    }

    // Auto rotate quote every 12 seconds
    setInterval(nextQuote, 12000);
  </script>
</body>
</html>
