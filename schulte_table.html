<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schulte Table — MIS Focus Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --success: #10b981;
      --danger: #ef4444;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --cell-bg: #1e293b;
      --cell-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .badge {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background: rgba(15, 23, 42, 0.6);
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #target-val {
      color: #818cf8;
    }

    #timer-val {
      color: #34d399;
    }

    #mistake-val {
      color: #f87171;
    }

    /* Schulte Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 10px;
      aspect-ratio: 1 / 1;
      width: 100%;
      position: relative;
    }

    .cell {
      background: var(--cell-bg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .cell:hover {
      background: var(--cell-hover);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .cell:active {
      transform: translateY(0) scale(0.96);
    }

    .cell.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--success) !important;
      color: var(--success);
      animation: pulse-success 0.3s ease;
    }

    .cell.wrong {
      background: rgba(239, 68, 68, 0.25) !important;
      border-color: var(--danger) !important;
      color: var(--danger);
      animation: shake 0.35s ease;
    }

    .cell.completed {
      opacity: 0.25;
      pointer-events: none;
      background: #0f172a;
      border-color: transparent;
      box-shadow: none;
    }

    @keyframes pulse-success {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    /* Modal overlay for completion */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }

    .modal-score {
      font-size: 2.2rem;
      font-weight: 800;
      color: #34d399;
      margin: 4px 0;
    }

    .modal-details {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .center-dot {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="container" style="position: relative;">

    <!-- Header -->
    <div class="header">
      <div class="title-group">
        <h1>Schulte Table</h1>
        <p>Tap numbers 1 → 25 in order</p>
      </div>
      <span class="badge">MIS FOCUS TRAINER</span>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Next Target</span>
        <span class="stat-value" id="target-val">1</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timer-val">0.00s</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Mistakes</span>
        <span class="stat-value" id="mistake-val">0</span>
      </div>
    </div>

    <!-- Schulte Grid -->
    <div class="grid" id="grid">
      <div class="center-dot"></div>
      <!-- 25 Cells generated dynamically -->
    </div>

    <!-- Action Buttons -->
    <div class="controls">
      <button class="btn btn-primary" id="restart-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Restart Grid
      </button>
    </div>

    <!-- Results Modal -->
    <div class="modal-overlay" id="modal">
      <div style="font-size: 2.5rem;">🎯</div>
      <div class="modal-title">Session Completed!</div>
      <div class="modal-score" id="final-time">0.00s</div>
      <div class="modal-details">
        <span id="final-mistakes">0</span> Mistakes Made<br>
        Accuracy: <strong id="final-accuracy" style="color:#fff;">100%</strong>
      </div>
      <button class="btn btn-primary" id="modal-restart-btn" style="width: 100%; margin-top: 10px;">
        Play Again
      </button>
    </div>

  </div>

  <script>
    const GRID_SIZE = 25; // 5x5 Grid
    let currentTarget = 1;
    let mistakes = 0;
    let startTime = null;
    let timerInterval = null;
    let isRunning = false;

    const gridEl = document.getElementById('grid');
    const targetValEl = document.getElementById('target-val');
    const timerValEl = document.getElementById('timer-val');
    const mistakeValEl = document.getElementById('mistake-val');
    const restartBtn = document.getElementById('restart-btn');
    const modalEl = document.getElementById('modal');
    const modalRestartBtn = document.getElementById('modal-restart-btn');
    const finalTimeEl = document.getElementById('final-time');
    const finalMistakesEl = document.getElementById('final-mistakes');
    const finalAccuracyEl = document.getElementById('final-accuracy');

    function shuffle(array) {
      let currentIndex = array.length, randomIndex;
      while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    function initGrid() {
      // Reset state
      clearInterval(timerInterval);
      isRunning = false;
      currentTarget = 1;
      mistakes = 0;
      startTime = null;

      targetValEl.textContent = '1';
      timerValEl.textContent = '0.00s';
      mistakeValEl.textContent = '0';
      modalEl.classList.remove('active');

      // Clear existing cells except center dot
      const cells = gridEl.querySelectorAll('.cell');
      cells.forEach(cell => cell.remove());

      // Create shuffled numbers 1 to 25
      const numbers = Array.from({ length: GRID_SIZE }, (_, i) => i + 1);
      shuffle(numbers);

      numbers.forEach(num => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = num;
        cell.dataset.value = num;

        cell.addEventListener('click', () => handleCellClick(cell, num));
        gridEl.appendChild(cell);
      });
    }

    function startTimer() {
      startTime = performance.now();
      isRunning = true;
      timerInterval = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        timerValEl.textContent = elapsed.toFixed(2) + 's';
      }, 30);
    }

    function handleCellClick(cell, num) {
      if (cell.classList.contains('completed')) return;

      // Start timer on first interaction
      if (!isRunning) {
        startTimer();
      }

      if (num === currentTarget) {
        // Correct tap
        cell.classList.add('correct');
        setTimeout(() => {
          cell.classList.remove('correct');
          cell.classList.add('completed');
        }, 150);

        currentTarget++;
        if (currentTarget <= GRID_SIZE) {
          targetValEl.textContent = currentTarget;
        } else {
          // Game Completed
          completeGame();
        }
      } else {
        // Wrong tap
        mistakes++;
        mistakeValEl.textContent = mistakes;
        cell.classList.add('wrong');
        setTimeout(() => {
          cell.classList.remove('wrong');
        }, 350);
      }
    }

    function completeGame() {
      clearInterval(timerInterval);
      isRunning = false;
      const totalTimeSeconds = ((performance.now() - startTime) / 1000).toFixed(2);
      
      const totalTaps = GRID_SIZE + mistakes;
      const accuracy = Math.round((GRID_SIZE / totalTaps) * 100);

      // Populate Modal
      finalTimeEl.textContent = totalTimeSeconds + 's';
      finalMistakesEl.textContent = mistakes;
      finalAccuracyEl.textContent = accuracy + '%';
      modalEl.classList.add('active');

      // Structured data payload compatible with MIS / postMessage / localStorage
      const misPayload = {
        type: 'MIS_SCHULTE_SESSION',
        timestamp: new Date().toISOString(),
        durationSeconds: parseFloat(totalTimeSeconds),
        mistakes: mistakes,
        accuracyPercent: accuracy,
        gridSize: GRID_SIZE
      };

      console.log('MIS Event Dispatched:', misPayload);

      // Emit event for parent app/MIS window if embedded
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(misPayload, '*');
      }

      // Save to localStorage for MIS logbook compatibility
      try {
        const prevLogs = JSON.parse(localStorage.getItem('mis_schulte_logs') || '[]');
        prevLogs.push(misPayload);
        localStorage.setItem('mis_schulte_logs', JSON.stringify(prevLogs));
      } catch (e) {
        console.warn('LocalStorage save failed:', e);
      }
    }

    restartBtn.addEventListener('click', initGrid);
    modalRestartBtn.addEventListener('click', initGrid);

    // Initialize on load
    initGrid();
  </script>
</body>
</html>
